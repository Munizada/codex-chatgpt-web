name: Windows Build

on:
  push:
    branches:
      - main
      - v6.1.3-base
      - fix/v6.1.3-reliability
    paths:
      - "src/adapters/chatgpt-web/**"
      - "launcher/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/patched-windows.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run verify

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV
      - run: bun run verify
      - run: bun run app:package
      - run: bun run app:smoke
      - name: Archive patched runtime
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath patched-runtime-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Web-GPT-Windows
          path: |
            launcher/artifacts/*.exe
            patched-runtime-windows-amd64.zip
          if-no-files-found: error
          retention-days: 30
