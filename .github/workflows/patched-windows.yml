name: v6.1.5-r11 Reliability Build

on:
  push:
    branches:
      - main
      - audit/r11-ipc-integrity-and-attribution
    paths:
      - "src/**"
      - "launcher/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/patched-windows.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-linux:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run verify

  build-windows:
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV
      - run: bun run verify
      - run: bun run app:package
      - run: bun run app:smoke
      - name: Archive patched runtime
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath patched-runtime-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Web-GPT-v6.1.5-r11-Windows
          path: |
            launcher/artifacts/*.exe
            patched-runtime-windows-amd64.zip
          if-no-files-found: error
          retention-days: 30
